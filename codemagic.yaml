workflows:
  ios-workflow:
    name: iOS Build (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      node: v20
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.shakeram389.kukurun
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App

    cache:
      cache_paths:
        - $CM_BUILD_DIR/node_modules
        - $HOME/.pub-cache
        - ios/App/Pods

    scripts:
      - name: Node.js 依存関係のインストール
        script: npm install

      - name: Web アセットを www/ にコピー
        script: node sync-www.js

      - name: Capacitor sync (iOS)
        script: npx cap sync ios

      - name: CocoaPods インストール
        script: |
          cd ios/App
          pod install

      - name: Xcode アーカイブ & IPA エクスポート
        script: |
          # ASC API キーをファイルに書き出す（改行を正しく保持）
          mkdir -p ~/.private_keys
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8

          # アーカイブ
          xcodebuild archive \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            -authenticationKeyPath ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8 \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=B6KV2PAQ6D

          # IPA エクスポート
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            -exportPath "$CM_BUILD_DIR/ipa" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            -authenticationKeyPath ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8

    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
      - $CM_BUILD_DIR/App.xcarchive
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

