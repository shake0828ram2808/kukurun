workflows:
  ios-workflow:
    name: iOS Build (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      node: v20
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.shakeram389.kukurun
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App

    cache:
      cache_paths:
        - $CM_BUILD_DIR/node_modules
        - $HOME/.pub-cache
        - ios/App/Pods

    scripts:
      - name: Node.js 依存関係のインストール
        script: npm install

      - name: Web アセットを www/ にコピー
        script: node sync-www.js

      - name: Capacitor sync (iOS)
        script: npx cap sync ios

      - name: CocoaPods インストール
        script: |
          cd ios/App
          pod install

      - name: コード署名ファイルを Apple から自動取得
        script: |
          app-store-connect fetch-signing-files \
            --bundle-id-identifier "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-types DISTRIBUTION \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Xcode アーカイブ & IPA エクスポート
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

