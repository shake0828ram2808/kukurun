workflows:
  ios-app-store:
    name: iOS App Store Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.shakeram389.kukurun
      groups:
        - app_store_connect
      vars:
        BUNDLE_ID: com.shakeram389.kukurun
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: latest
      xcode: 26
      cocoapods: default

    cache:
      cache_paths:
        - $CM_BUILD_DIR/node_modules
        - ios/App/Pods

    scripts:
      - name: Node.js 依存関係のインストール
        script: npm install

      - name: Web アセットを www/ にコピー
        script: npm run build

      - name: Capacitor sync (iOS)
        script: npx cap sync ios

      - name: Generate iOS app icons
        script: |
          mkdir -p assets
          cp appIcon.png assets/icon-only.png
          npx capacitor-assets generate --ios

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Set build number
        script: /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/App/App/Info.plist

      - name: Set marketing version
        script: |
          sed -i '' "s/MARKETING_VERSION = [0-9][0-9.]*/MARKETING_VERSION = 1.0.$BUILD_NUMBER/" ios/App/App.xcodeproj/project.pbxproj

      - name: List Xcode schemes
        script: xcodebuild -workspace "$XCODE_WORKSPACE" -list

      - name: Build iOS IPA
        script: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/ios/App.xcarchive \
            archive \
            DEVELOPMENT_TEAM=B6KV2PAQ6D \
            ONLY_ACTIVE_ARCH=NO 2>&1
          xcodebuild \
            -exportArchive \
            -archivePath build/ios/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /dev/stdin <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>B6KV2PAQ6D</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.shakeram389.kukurun</key><string>Codemagic</string>
            </dict>
          </dict></plist>
          PLIST

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
