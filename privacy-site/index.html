<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プライバシーポリシー一覧</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
  <style>
    :root {
      --font:     'Kosugi Maru', sans-serif;
      --theme:    #5C5FE8;
      --theme-lt: #EEEEFF;
      --bg:       #D6EEFA;
      --surface:  #FFFFFF;
      --text:     #1B2640;
      --text2:    #566480;
      --sh:       4px 4px 12px rgba(180,210,235,.6), -2px -2px 8px rgba(255,255,255,.8);
      --r:        20px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 48px 16px 64px;
      line-height: 1.8;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    header h1 {
      font-size: 1.5rem;
      color: var(--theme);
    }

    header p {
      font-size: 0.85rem;
      color: var(--text2);
      margin-top: 6px;
    }

    .app-list {
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .app-card {
      display: flex;
      align-items: center;
      gap: 18px;
      background: var(--surface);
      border-radius: var(--r);
      padding: 20px 24px;
      box-shadow: var(--sh);
      text-decoration: none;
      color: var(--text);
      transition: transform .15s, box-shadow .15s;
    }

    .app-card:hover,
    .app-card:focus {
      transform: translateY(-2px);
      box-shadow: 6px 6px 16px rgba(180,210,235,.7), -3px -3px 10px rgba(255,255,255,.9);
    }

    .app-card img {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      flex-shrink: 0;
    }

    .app-info .app-name {
      font-size: 1.05rem;
      font-weight: bold;
      color: var(--theme);
    }

    .app-info .app-desc {
      font-size: 0.82rem;
      color: var(--text2);
      margin-top: 2px;
    }

    footer {
      text-align: center;
      margin-top: 56px;
      font-size: 0.78rem;
      color: var(--text2);
    }
  </style>
</head>
<body>

  <header>
    <h1>プライバシーポリシー</h1>
    <p>各アプリのプライバシーポリシーをご確認いただけます。</p>
  </header>

  <main class="app-list">

    <a href="./kukurun/" class="app-card">
      <img src="./kukurun/appIcon.png" alt="kukurunアイコン">
      <div class="app-info">
        <div class="app-name">ピコとくく</div>
        <div class="app-desc">九九学習アプリ</div>
      </div>
    </a>

    <!-- 今後のアプリはここに追加 -->
    <!--
    <a href="./otherapp/" class="app-card">
      <img src="./otherapp/appIcon.png" alt="アプリアイコン">
      <div class="app-info">
        <div class="app-name">アプリ名</div>
        <div class="app-desc">説明文</div>
      </div>
    </a>
    -->

  </main>

  <footer>
    <p>&copy; 2026 shake0828ram2808</p>
  </footer>

</body>
</html>
