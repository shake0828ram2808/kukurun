<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>はなしかた デモ — くくるん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap">
<style>
:root {
  --font:     'Kosugi Maru', sans-serif;
  --theme:    #5C5FE8;
  --theme-lt: #EEEEFF;
  --theme-dk: #4044C0;
  --bg:       #D6EEFA;
  --surface:  #FFFFFF;
  --surface2: #EAF5FF;
  --text:     #1B2640;
  --text2:    #566480;
  --border:   #BDD4EA;
  --gold:     #F5A623;
  --gold-lt:  #FFF8E8;
  --r:        16px;
  --r-sm:     10px;
  --r-pill:   999px;
  --sh:       0 2px 10px rgba(27,38,64,.07);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  min-height: 100dvh;
  padding: 24px 16px 48px;
  color: var(--text);
}
.wrap {
  max-width: 420px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* ── ヘッダー ── */
.demo-title {
  text-align: center;
  font-size: 13px;
  color: var(--text2);
  letter-spacing: .04em;
}
.demo-title strong {
  display: block;
  font-size: 20px;
  color: var(--text);
  margin-bottom: 4px;
}

/* ── カード ── */
.card {
  background: var(--surface);
  border-radius: var(--r);
  box-shadow: var(--sh);
  padding: 20px 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.card-label {
  font-size: 13px;
  color: var(--text2);
  letter-spacing: .04em;
}

/* ── はなしかた セレクター ── */
.voice-selector {
  display: flex;
  gap: 10px;
}
.voice-opt {
  flex: 1;
  border: 2px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--surface);
  padding: 12px 10px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  transition: border-color .15s, background .15s, box-shadow .15s;
  position: relative;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.voice-opt.active {
  border-color: var(--theme);
  background: var(--theme-lt);
  box-shadow: 0 0 0 3px rgba(92,95,232,.12);
}
.voice-opt.premium {
  border-color: var(--gold);
  background: var(--gold-lt);
}
.voice-opt.premium.active {
  border-color: var(--gold);
  background: var(--gold-lt);
  box-shadow: 0 0 0 3px rgba(245,166,35,.18);
}
.voice-opt-icon {
  font-size: 28px;
  line-height: 1;
}
.voice-opt-name {
  font-size: 13px;
  font-weight: bold;
  color: var(--text);
}
.voice-opt-sub {
  font-size: 10px;
  color: var(--text2);
  text-align: center;
  line-height: 1.4;
}
.voice-opt.premium .voice-opt-name { color: #7A5600; }
.voice-opt.premium .voice-opt-sub  { color: #9A7020; }
.premium-badge {
  position: absolute;
  top: -8px;
  right: -6px;
  background: var(--gold);
  color: #fff;
  font-size: 9px;
  font-weight: bold;
  padding: 2px 7px;
  border-radius: var(--r-pill);
  letter-spacing: .03em;
  box-shadow: 0 1px 4px rgba(0,0,0,.18);
}
.voice-check {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 2px;
  flex-shrink: 0;
}
.voice-opt.active .voice-check {
  background: var(--theme);
  border-color: var(--theme);
}
.voice-opt.premium.active .voice-check {
  background: var(--gold);
  border-color: var(--gold);
}
.voice-check svg { display: none; }
.voice-opt.active .voice-check svg { display: block; }

/* ── サンプルフレーズ ── */
.samples-label {
  font-size: 13px;
  color: var(--text2);
  letter-spacing: .04em;
}
.samples {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.sample-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--surface2);
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  padding: 12px 14px;
  cursor: pointer;
  font-family: var(--font);
  font-size: 15px;
  color: var(--text);
  text-align: left;
  width: 100%;
  transition: background .12s, border-color .12s, transform .08s;
  -webkit-tap-highlight-color: transparent;
  position: relative;
  user-select: none;
}
.sample-btn:active { transform: scale(.97); }
.sample-btn.speaking {
  border-color: var(--theme);
  background: var(--theme-lt);
}
.sample-btn.speaking.premium-mode {
  border-color: var(--gold);
  background: var(--gold-lt);
}
.play-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--theme);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background .15s;
}
.sample-btn.premium-mode .play-icon { background: var(--gold); }
.play-icon svg { margin-left: 2px; }
.sample-text { flex: 1; line-height: 1.5; }
.sample-ruby {
  display: block;
  font-size: 11px;
  color: var(--text2);
  margin-top: 1px;
}

/* ── 波形アニメ ── */
.wave {
  display: flex;
  align-items: center;
  gap: 2px;
  opacity: 0;
  transition: opacity .15s;
  flex-shrink: 0;
}
.sample-btn.speaking .wave { opacity: 1; }
.wave span {
  display: block;
  width: 3px;
  border-radius: 2px;
  background: var(--theme);
  animation: wave-bar 0.7s ease-in-out infinite;
}
.sample-btn.premium-mode .wave span { background: var(--gold); }
.wave span:nth-child(1) { height: 8px;  animation-delay: 0s; }
.wave span:nth-child(2) { height: 14px; animation-delay: .1s; }
.wave span:nth-child(3) { height: 10px; animation-delay: .2s; }
.wave span:nth-child(4) { height: 16px; animation-delay: .05s; }
.wave span:nth-child(5) { height: 8px;  animation-delay: .15s; }
@keyframes wave-bar {
  0%, 100% { transform: scaleY(1); }
  50%       { transform: scaleY(.35); }
}

/* ── 品質バッジ ── */
.quality-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-radius: var(--r-sm);
  font-size: 12px;
  line-height: 1.5;
}
.quality-row.normal-q  { background: var(--surface2); color: var(--text2); }
.quality-row.premium-q { background: var(--gold-lt);  color: #7A5600; }
.quality-row span { font-size: 18px; flex-shrink: 0; }

/* ── 注記 ── */
.note {
  font-size: 11px;
  color: var(--text2);
  text-align: center;
  line-height: 1.7;
  padding: 0 4px;
}
</style>
</head>
<body>
<div class="wrap">

  <div class="demo-title">
    <strong>はなしかた　デモ</strong>
    くくるん — 音声スタイル機能モック
  </div>

  <!-- ── はなしかた選択 ── -->
  <div class="card">
    <div class="card-label">はなしかたを　えらぼう</div>
    <div class="voice-selector">

      <!-- ノーマル -->
      <div class="voice-opt active" id="opt-normal" onclick="selectVoice('normal')">
        <div class="voice-opt-icon">🔊</div>
        <div class="voice-opt-name">ふつう</div>
        <div class="voice-opt-sub">むりょうで<br>つかえる</div>
        <div class="voice-check">
          <svg width="10" height="8" viewBox="0 0 10 8" fill="none">
            <path d="M1 4l3 3 5-6" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <!-- なめらか (プレミアム) -->
      <div class="voice-opt premium" id="opt-premium" onclick="selectVoice('premium')">
        <div class="premium-badge">★ プレミアム</div>
        <div class="voice-opt-icon">✨</div>
        <div class="voice-opt-name">なめらか</div>
        <div class="voice-opt-sub">Google Neural2<br>人間らしい声</div>
        <div class="voice-check">
          <svg width="10" height="8" viewBox="0 0 10 8" fill="none">
            <path d="M1 4l3 3 5-6" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

    </div>

    <!-- 品質メモ -->
    <div class="quality-row normal-q" id="quality-note">
      <span>📱</span>
      ブラウザ標準の読み上げ。端末によって声が変わります。
    </div>
  </div>

  <!-- ── サンプルフレーズ ── -->
  <div class="card">
    <div class="samples-label">タップして　きいてみよう</div>
    <div class="samples" id="samples">

      <button class="sample-btn" onclick="playSample(this, 'に　かける　さんは　ろく')">
        <div class="play-icon">
          <svg width="12" height="14" viewBox="0 0 12 14" fill="white"><path d="M1 1l10 6-10 6V1z"/></svg>
        </div>
        <div class="sample-text">
          ２×３＝６
          <span class="sample-ruby">に　かける　さんは　ろく</span>
        </div>
        <div class="wave">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </button>

      <button class="sample-btn" onclick="playSample(this, 'し　かける　ごは　にじゅう')">
        <div class="play-icon">
          <svg width="12" height="14" viewBox="0 0 12 14" fill="white"><path d="M1 1l10 6-10 6V1z"/></svg>
        </div>
        <div class="sample-text">
          ４×５＝２０
          <span class="sample-ruby">し　かける　ごは　にじゅう</span>
        </div>
        <div class="wave">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </button>

      <button class="sample-btn" onclick="playSample(this, 'しち　かける　はちは　ごじゅうろく')">
        <div class="play-icon">
          <svg width="12" height="14" viewBox="0 0 12 14" fill="white"><path d="M1 1l10 6-10 6V1z"/></svg>
        </div>
        <div class="sample-text">
          ７×８＝５６
          <span class="sample-ruby">しち　かける　はちは　ごじゅうろく</span>
        </div>
        <div class="wave">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </button>

      <button class="sample-btn" onclick="playSample(this, 'すばらしい！　よくできました！')">
        <div class="play-icon">
          <svg width="12" height="14" viewBox="0 0 12 14" fill="white"><path d="M1 1l10 6-10 6V1z"/></svg>
        </div>
        <div class="sample-text">
          せいかい！
          <span class="sample-ruby">すばらしい！　よくできました！</span>
        </div>
        <div class="wave">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </button>

    </div>
  </div>

  <p class="note">
    ※「なめらか」モードは現在デモ用です。<br>
    本番は Google Cloud Neural2（ja-JP）API を使用します。<br>
    ブラウザ内では最高品質の日本語音声で代用しています。
  </p>

</div>

<script>
/* ── 状態 ── */
let currentMode = 'normal';
let currentUtterance = null;
let currentBtn = null;

/* ── 音声モード切り替え ── */
function selectVoice(mode) {
  currentMode = mode;

  // ボタン表示
  document.getElementById('opt-normal').classList.toggle('active', mode === 'normal');
  document.getElementById('opt-premium').classList.toggle('active', mode === 'premium');

  // 品質メモ
  const note = document.getElementById('quality-note');
  if (mode === 'normal') {
    note.className = 'quality-row normal-q';
    note.innerHTML = '<span>📱</span> ブラウザ標準の読み上げ。端末によって声が変わります。';
  } else {
    note.className = 'quality-row premium-q';
    note.innerHTML = '<span>✨</span> Google Cloud Neural2 の自然なイントネーション。（デモ: ブラウザ最高品質音声で代用）';
  }

  // サンプルボタンの色を更新
  document.querySelectorAll('.sample-btn').forEach(btn => {
    btn.classList.toggle('premium-mode', mode === 'premium');
  });

  stopCurrent();
}

/* ── 再生 ── */
function playSample(btn, text) {
  if (currentBtn === btn && speechSynthesis.speaking) {
    stopCurrent();
    return;
  }
  stopCurrent();

  currentBtn = btn;
  btn.classList.add('speaking');
  if (currentMode === 'premium') btn.classList.add('premium-mode');

  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ja-JP';

  if (currentMode === 'normal') {
    // ふつうモード: デフォルト設定
    utter.rate  = 0.88;
    utter.pitch = 1.1;
    utter.volume = 1;
  } else {
    // なめらかモード: ゆっくり・やや低め → 落ち着いた先生らしい声に
    const voices = speechSynthesis.getVoices();
    const jpVoice = voices.find(v => v.lang === 'ja-JP' && v.localService)
                 || voices.find(v => v.lang === 'ja-JP')
                 || voices.find(v => v.lang.startsWith('ja'));
    if (jpVoice) utter.voice = jpVoice;
    utter.rate   = 0.80;
    utter.pitch  = 0.95;
    utter.volume = 1;
  }

  utter.onend = utter.onerror = () => {
    btn.classList.remove('speaking');
    if (currentBtn === btn) currentBtn = null;
  };

  currentUtterance = utter;
  speechSynthesis.speak(utter);
}

function stopCurrent() {
  speechSynthesis.cancel();
  if (currentBtn) {
    currentBtn.classList.remove('speaking');
    currentBtn = null;
  }
  currentUtterance = null;
}

/* ── 音声リスト読み込み ── */
speechSynthesis.onvoiceschanged = () => { speechSynthesis.getVoices(); };
</script>
</body>
</html>
